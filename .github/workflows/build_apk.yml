name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Show biggest files
        run: |
          ls -lh build/app/outputs/flutter-apk/
          unzip -lv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | sort -k3 -nr | head -25

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mamash-app-release
          path: build/app/outputs/flutter-apk/*.apk
